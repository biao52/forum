spring:
  redis:
    host: ${REDIS_HOST:xxx.xxx.xxx.xxx} # 服务器Redis地址（建议用环境变量注入）
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:你的生产Redis密码} # 生产环境必须设置密码
    database: 0
    lettuce:
      pool:
        max-active: 16 # 生产环境连接池调大
        max-wait: -1ms
        max-idle: 16
        min-idle: 2
    timeout: 10000ms
  application:
    name: 论坛系统
  output:
    ansi:
      enabled: NEVER # 生产环境关闭彩色日志
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:xxx.xxx.xxx.xxx}:3306/forum_db_001?characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:prod_forum_user} # 生产环境创建专用数据库用户（非root）
    password: ${MYSQL_PWD:生产数据库密码}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境数据库连接池优化（可选）
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  web:
    resources:
      static-locations: classpath:/static/
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: NON_NULL
  servlet:
    multipart:
      max-file-size: 2MB # 生产环境限制更小的文件上传
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:58080} # 生产端口（建议用环境变量）
  tomcat:
    max-threads: 200 # Tomcat线程数优化
    min-spare-threads: 20

logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss
  level:
    root: warn # 生产环境降低日志级别，减少IO
    com.yb.forum: info # 业务包保留info级别
  file:
    path: /app/log # 生产日志目录（需提前创建并赋权）
    name: /app/log/forum-system.log
  logback:
    rollingpolicy:
      max-file-size: 100MB # 日志文件分割
      max-history: 30 # 保留30天日志
      total-size-cap: 10GB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl # 生产关闭SQL打印

# 项目自定义配置
bit-forum:
  login:
    url: sign-in.html
  index:
    board-num: 9

# MinIO 生产配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://xxx.xxx.xxx.xxx:9000}
  accessKey: ${MINIO_ACCESS_KEY:生产MinIO AccessKey}
  secretKey: ${MINIO_SECRET_KEY:生产MinIO SecretKey}
  bucketName: forum-avatar

# JWT 生产配置（建议用环境变量注入，避免硬编码）
jwt:
  key: ${JWT_KEY:forum-graduation-project-secret-key-2026-yangbiao-secure-jwt-token-key}

# Dify 生产配置
dify:
  api-key: ${DIFY_API_KEY:app-6mz0qer5TitWE3ubYAZlCrvN}
  base-url: ${DIFY_BASE_URL:http://xxx.xxx.xxx.xxx} # 生产Dify服务器地址
  app-id: ${DIFY_APP_ID:iNbAp4U4LEZ7Zh5q}
  timeout: 30000
  system-prompt: |
    你是论坛智能助手，专门为论坛用户提供帮助。你的职责包括：
    1. 回答用户关于论坛使用的问题
    2. 提供技术支持和指导
    3. 解答用户的疑问
    4. 保持友好、专业、耐心的态度
    5. 回答简洁清晰，避免冗长
    6. 如果遇到无法回答的问题，礼貌地告知用户
    请注意：
    - 使用中文回答
    - 语气亲切自然
    - 提供准确、有用的信息