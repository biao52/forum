spring:
  redis:
    host: localhost  # Redis 在虚拟机上，使用 localhost
    port: 6379
    password:  # 如果没有设置密码就留空
    database: 0
    lettuce:
      pool:
        max-active: 16
        max-wait: -1ms
        max-idle: 16
        min-idle: 2
    timeout: 10000ms
  application:
    name: 论坛系统
  output:
    ansi:
      enabled: NEVER
  datasource:
    url: jdbc:mysql://localhost:3306/forum_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12345678  # 你之前设置的 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  web:
    resources:
      static-locations: classpath:/static/
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: NON_NULL
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080  # 改为 8080，更常用
  tomcat:
    max-threads: 200
    min-spare-threads: 20

logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss
  level:
    root: info
    com.yb.forum: debug  # 初期调试用，可查看详细日志
  file:
    path: ./logs
    name: ./logs/forum-system.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 10GB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印 SQL 方便调试

# 项目自定义配置
bit-forum:
  login:
    url: sign-in.html
  index:
    board-num: 9

# MinIO 配置（使用你的虚拟机 IP）
minio:
  endpoint: http://192.168.52.128:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: forum-avatar

# JWT 配置
jwt:
  key: forum-graduation-project-secret-key-2026-yangbiao-secure-jwt-token-key

