<!-- Page header -->
<div class="page-header d-print-none">
  <div class="container-xl">
    <div class="row g-2 align-items-center">
      <div class="col">
        <!-- Page pre-title -->
        <!-- <div class="page-pretitle">
          子标题
        </div> -->
        <h2 class="page-title" id="article_list_board_title">
          <!-- 如果是版块页面，那么文字替换成版块名 -->
          首页
        </h2>
        <!-- 帖子数量 -->
        <div class="text-muted mt-1" id="article_list_count_board"></div>
      </div>
      <!-- Page title actions -->
      <div class="col-auto ms-auto d-print-none">
        <div class="btn-list">
          <!-- 发新帖按钮 宽屏 -->
          <a  href="javascript:void(0);" class="btn btn-primary d-none d-sm-inline-block article_post">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                 stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M12 5l0 14" />
              <path d="M5 12l14 0" />
            </svg>
            发布帖子
          </a>
          <!-- 发新帖按钮 窄屏 -->
          <a href="javascript:void(0);" class="btn btn-primary d-sm-none btn-icon article_post" aria-label="发布帖子">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                 stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M12 5l0 14" />
              <path d="M5 12l14 0" />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Page body -->
<div class="page-body">
  <div class="container-xl">
    <div class="row justify-content-center">
      <!-- 显示列表的宽度 -->
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <div class="divide-y" id="artical-items-body">
              <!-- 动态生成帖子列表 -->
            </div>
          </div>
        </div>
        <div class="card mt-2">
          <div class="card-body d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <div class="d-flex align-items-center">
              <span class="me-2">每页显示</span>
              <select id="article_page_size" class="form-select form-select-sm" style="width: auto;">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
              </select>
              <span class="ms-2">条</span>
            </div>
            <div class="d-flex align-items-center">
              <span class="me-2">跳转到</span>
              <input id="article_page_input" type="number" min="1" class="form-control form-control-sm" style="width: 80px;">
              <span class="ms-1">页</span>
              <button id="article_page_go" class="btn btn-sm btn-secondary ms-2">跳转</button>
            </div>
            <ul class="pagination mb-0" id="article_pagination">
              <!-- 动态生成页码 -->
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- 正文 结束 -->
</div>
<script>
  $(function () {
    // ==================== 全局 AJAX 设置：自动添加 JWT Token ====================
    $.ajaxSetup({
      beforeSend: function(xhr) {
        const token = localStorage.getItem('token');
        if (token) {
          xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        }
      }
    });

    // ===== 分页相关变量 =====
    let currentPage = 1;
    let pageSize = 10;    // 每页显示条数，可由下拉框修改
    let totalPages = 1;
    let allArticles = [];   // 当前版块 / 搜索结果的全部帖子数据


    // ========================= 获取版块下帖子信息 =======================
    // 获取当前选中的版块
    let activeLiEl = $('#topBoardList>.active');
    // 构造query string
    let queryString = '';
    let boardData = activeLiEl.data('board');

    // 1. 先看是否选中了某个版块
    if (boardData) {
      // 构造query string
      queryString = '?boardId=' + boardData.id;
      // 获取版块信息
      getBoardInfo(boardData.id);
    } else {
      // 设置版块名称
      $('#article_list_board_title').html('首页');
      $('#article_list_count_board').hide();
    }


    // ========================= 获取版块信息 =======================
    function getBoardInfo (boardId) {
      if (!boardId) {
        return;
      }
      // 发送请求， 成功后，显示版块相关信息
      $.ajax({
        type : 'get',
        url : 'board/getById?id=' + boardId,
        // 回调
        success : function (respData) {
          if(respData.code == 0) {
            let board = respData.data;
            // 成功时，更新页面的内容
            $('#article_list_board_title').html(board.name); // 版块名
            $('#article_list_count_board').html('帖子数量: ' +board.articleCount);
          } else {
            // 失败
            $.toast({
              heading: '警告',
              text: respData.message,
              icon: 'warning'
            });
          }
        },
        error : function () {
          // 提示信息
          $.toast({
            heading: '错误',
            text: '访问出现问题，请与管理员联系.',
            icon: 'error'
          });
        }

      });
    }

    // 2. 再读取顶部搜索框中的关键字（注意：这个输入框在 index.html 里）
    let keyword = $('#index_search_input').val();
    if (keyword) {
      keyword = keyword.trim();
    }
    if (keyword) {
      // 有关键字时，拼接到 queryString 中
      if (queryString) {
        // 已经有 ?boardId=xxx 了，就在后面追加 &keyword=...
        queryString += '&keyword=' + encodeURIComponent(keyword);
      } else {
        // 没有任何参数，就直接从 ?keyword=... 开始
        queryString = '?keyword=' + encodeURIComponent(keyword);
      }

      // 额外：把标题改成“搜索结果：xxx”，给用户一个反馈
      $('#article_list_board_title').html('搜索结果：' + keyword);
    }
    console.log('最终请求 URL = article/getAllByBoardId' + queryString);
    // ========================= 获取帖子列表 =======================
    // 成功后，先缓存数据再分页渲染
    $.ajax({
      type : 'get',
      url : 'article/getAllByBoardId' + queryString,

      // 回调
      success : function (respData) {
        if (respData.code == 0) {
          // 成功：先保存所有帖子数据，再渲染当前页并构建分页
          allArticles = respData.data || [];
          currentPage = 1;
          // 用实际查询到的帖子数量更新显示
          if (boardData) {
            $('#article_list_count_board').html('帖子数量: ' + allArticles.length);
          }
          renderCurrentPage();
        } else {
          // 失败
          $.toast({
            heading: '警告',
            text: respData.message,
            icon: 'warning'
          });
        }
      },
      error : function () {
        // 提示信息
        $.toast({
          heading: '错误',
          text: '访问出现问题，请与管理员联系.',
          icon: 'error'
        });
      }

    });

    // ========================= 渲染当前页 & 构建分页 =======================
    function renderCurrentPage() {
      let listContainer = $('#artical-items-body');
      listContainer.html('');
      let totalItems = allArticles.length;
      if (!totalItems) {
        listContainer.html('还没有帖子');
        $('#article_pagination').empty();
        return;
      }
      let start = (currentPage - 1) * pageSize;
      let end = start + pageSize;
      let pageData = allArticles.slice(start, end);
      listBuildArticleList(pageData);
      buildPagination(totalItems);
    }

    function buildPagination(totalItems) {
      let paginationEl = $('#article_pagination');
      paginationEl.empty();

      // 没有帖子时不显示分页，其余情况都显示
      if (!totalItems) {
        return;
      }

      totalPages = Math.max(1, Math.ceil(totalItems / pageSize));

      // 上一页
      let prevDisabled = (currentPage === 1) ? ' disabled' : '';
      paginationEl.append(
              '<li class="page-item' + prevDisabled + '">'+
              '<a class="page-link" href="javascript:void(0);" data-page="' + (currentPage - 1) + '">上一页</a>'+
              '</li>'
      );

      // 中间页码
      for (let p = 1; p <= totalPages; p++) {
        let activeClass = (p === currentPage) ? ' active' : '';
        paginationEl.append(
                '<li class="page-item' + activeClass + '">'+
                '<a class="page-link" href="javascript:void(0);" data-page="' + p + '">' + p + '</a>'+
                '</li>'
        );
      }

      // 下一页
      let nextDisabled = (currentPage === totalPages) ? ' disabled' : '';
      paginationEl.append(
              '<li class="page-item' + nextDisabled + '">'+
              '<a class="page-link" href="javascript:void(0);" data-page="' + (currentPage + 1) + '">下一页</a>'+
              '</li>'
      );

      // 绑定点击事件（页码、上一页、下一页）
      paginationEl.find('a.page-link').off('click').on('click', function () {
        let page = parseInt($(this).data('page'), 10);
        if (!page || page < 1 || page > totalPages || page === currentPage) {
          return;
        }
        currentPage = page;
        renderCurrentPage();
      });
    }

    // ========================= 构造帖子列表 =======================
    function listBuildArticleList(data) {
      if(data.length == 0) {
        $('#artical-items-body').html('还没有帖子');
        return;
      }
      // 默认头像路径
      let avatarUrl = 'image/avatar01.jpeg';
      // 遍历结果
      data.forEach(article => {
        // 用户信息兜底：作者被删除时 user 可能为 null
        if (!article.user) {
          article.user = { nickname: '已注销用户', avatarUrl: '' };
        }
        // 设置默认头像
        let finalAvatarUrl = avatarUrl;
        if (article.user.avatarUrl && article.user.avatarUrl.startsWith('http')) {
          finalAvatarUrl = article.user.avatarUrl;
        }
        // 构造HTML
        let articleHtmlStr = '<div>'
                + ' <div class="row">'
                + ' <div class="col-auto">'
                + ' <span class="avatar" style="background-image: url(' + finalAvatarUrl + ')"></span>'
                + ' </div>'
                + ' <div class="col">'
                + ' <div class="text-truncate">'
                + ' <a href="javascript:void(0);" class="article_list_a_title">'
                + ' <strong>' + article.title + '</strong>'
                + ' </a>'
                + ' </div>'
                + ' <div class="text-muted mt-2">'
                + ' <div class="row">'
                + ' <div class="col">'
                + ' <ul class="list-inline list-inline-dots mb-0">'
                + ' <li class="list-inline-item">'
                + ' <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-user"'
                + ' width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"'
                + ' fill="none" stroke-linecap="round" stroke-linejoin="round">'
                + ' <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>'
                + ' <path d="M12 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path>'
                + ' <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path>'
                + ' </svg> '
                + article.user.nickname
                + ' </li>'
                + ' <li class="list-inline-item">'
                + ' <svg xmlns="http://www.w3.org/2000/svg"'
                + ' class="icon icon-tabler icon-tabler-clock-edit" width="24" height="24"'
                + ' viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"'
                + ' stroke-linecap="round" stroke-linejoin="round">'
                + ' <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>'
                + ' <path d="M21 12a9 9 0 1 0 -9.972 8.948c.32 .034 .644 .052 .972 .052"></path>'
                + ' <path d="M12 7v5l2 2"></path>'
                + ' <path d="M18.42 15.61a2.1 2.1 0 0 1 2.97 2.97l-3.39 3.42h-3v-3l3.42 -3.39z">'
                + ' </path>'
                + ' </svg> '
                + article.createTime
                + ' </li>'
                + ' </ul>'
                + ' </div>'
                + ' <div class="col-auto d-none d-md-inline">'
                + ' <ul class="list-inline list-inline-dots mb-0">'
                + ' <li class="list-inline-item">'
                + ' <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-eye"'
                + ' width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"'
                + ' fill="none" stroke-linecap="round" stroke-linejoin="round">'
                + ' <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>'
                + ' <path d="M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path>'
                + ' <path'
                + ' d="M22 12c-2.667 4.667 -6 7 -10 7s-7.333 -2.333 -10 -7c2.667 -4.667 6 -7 10 -7s7.333 2.333 10 7">'
                + ' </path>'
                + ' </svg> '
                + article.visitCount
                + ' </li>'
                + ' <li class="list-inline-item">'
                + ' <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-heart"'
                + ' width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"'
                + ' fill="none" stroke-linecap="round" stroke-linejoin="round">'
                + ' <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>'
                + ' <path'
                + ' d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572">'
                + ' </path>'
                + ' </svg> '
                + article.likeCount
                + ' </li>'
                + ' <li class="list-inline-item">'
                + ' <svg xmlns="http://www.w3.org/2000/svg"'
                + ' class="icon icon-tabler icon-tabler-message-circle" width="24" height="24"'
                + ' viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"'
                + ' stroke-linecap="round" stroke-linejoin="round">'
                + ' <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>'
                + ' <path d="M3 20l1.3 -3.9a9 8 0 1 1 3.4 2.9l-4.7 1"></path>'
                + ' <path d="M12 12l0 .01"></path>'
                + ' <path d="M8 12l0 .01"></path>'
                + ' <path d="M16 12l0 .01"></path>'
                + ' </svg> '
                + article.replyCount
                + ' </li>'
                + ' </ul>'
                + ' </div>'
                + ' </div>'
                + ' </div>'
                + ' </div>'
                + ' </div>'
                + ' </div>';
        // 转为元素对象
        let articleItem = $(articleHtmlStr);
        // 获取标题的 a 标签
        let articleTitle = articleItem.find('.article_list_a_title');
        // 处理标题点击事件
        articleTitle.click(function() {
          // 通过全局变量保存当前访问的帖子信息
          currentArticle = article;
          removeNavActive();
          $('#bit-forum-content').load('details.html');
        });
        // 添加到列表
        $('#artical-items-body').append(articleItem);
      });
    }

    // ========================= 分页控件事件绑定 =======================
    // 修改每页条数
    $('#article_page_size').on('change', function () {
      let val = parseInt($(this).val(), 10);
      if (!val || val <= 0) {
        return;
      }
      pageSize = val;
      currentPage = 1;
      renderCurrentPage();
    });

    // 跳转到指定页
    function goToInputPage() {
      let val = parseInt($('#article_page_input').val(), 10);
      if (!val || val < 1 || val > totalPages) {
        $.toast && $.toast({
          heading: '提示',
          text: '请输入 1 到 ' + totalPages + ' 之间的页码',
          icon: 'warning'
        });
        return;
      }
      currentPage = val;
      renderCurrentPage();
    }

    $('#article_page_go').on('click', function () {
      goToInputPage();
    });

    $('#article_page_input').on('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        goToInputPage();
      }
    });

    // ================== 处理发贴事件 =====================
    $('.article_post').click(function () {
      console.log('加载发贴页面');
      removeNavActive();
      $('#bit-forum-content').load('article.html');
    });

  });
</script>
