  <script>
  $(function() {
    // ==================== 核心修复：全局 AJAX 设置，自动添加 JWT Token ====================
    $.ajaxSetup({
      beforeSend: function(xhr) {
        // 从 localStorage 获取 token 并放入请求头
        const token = localStorage.getItem('token');
        if (token) {
          xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        }
      },
      complete: function(xhr, status) {
        // 捕获未登录或 Token 失效状态
        if (xhr.status === 401) {
          $.toast({ heading: '警告', text: '登录已失效，请重新登录', icon: 'warning' });
          setTimeout(function() { location.assign('/sign-in.html'); }, 1500);
        }
      }
    });
    // ==============================================================================

    // 路由加载逻辑
    $('.admin-nav-item').click(function() {
      // 样式切换
      $('.admin-nav-item').parent().removeClass('active');
      $(this).parent().addClass('active');
      
      // 加载对应页面
      let targetPage = $(this).data('target');
      $('#admin-content-area').load(targetPage);
    });

    // 默认加载第一个页面(数据看板)
    $('.admin-nav-item').first().trigger('click');

    // 退出登录逻辑
    $('#admin_logout').click(function () {
      $.ajax({
        type : 'post',
        url : '/user/logout',
        complete : function () {
          localStorage.removeItem('token');
          location.assign('/sign-in.html');
        }
      });
    });
    function checkAdminRole() {
      // 调用现有的用户信息接口
      $.ajax({
        type: 'get',
        url: 'user/info',
        success: function(res) {
          if (res.code == 0) {
            // 判断 isAdmin 字段，0 为普通用户，1 为管理员
            if (res.data.isAdmin !== 1) {
              // 如果是普通用户，直接重定向到前台首页
              window.location.href = '/index.html';
            }
          } else {
            // 如果获取信息失败（如未登录），跳转到登录页
            window.location.href = '/sign-in.html';
          }
        },
        error: function() {
          window.location.href = '/sign-in.html';
        }
      });
    }

// 页面加载时立即执行校验
    checkAdminRole();

  });
</script>
