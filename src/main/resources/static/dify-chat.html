<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="shortcut icon" href="/favicon.png">
  <title>智能助手</title>
  <!-- 导入 CSS -->
  <link href="./dist/css/tabler.min.css?1674944402" rel="stylesheet" />
  <link rel="stylesheet" href="./dist/css/jquery.toast.css">
  <!-- 自定义样式 -->
  <style>
    .loading-dots span {
      animation: loading-dots 1.4s infinite ease-in-out both;
      display: inline-block;
      font-size: 24px;
      font-weight: bold;
      color: #999;
    }
    .loading-dots span:nth-child(1) {
      animation-delay: -0.32s;
    }
    .loading-dots span:nth-child(2) {
      animation-delay: -0.16s;
    }
    @keyframes loading-dots {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: scale(0.8);
      }
      40% {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    /* 会话列表样式 */
    #session-list .list-group-item {
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }
    #session-list .list-group-item:hover {
      background-color: #f8f9fa;
      border-left-color: #206bc4;
    }
    #session-list .list-group-item.active {
      background-color: #e7f1ff;
      border-left-color: #206bc4;
    }
    #session-list .session-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    #session-list .session-preview {
      font-size: 12px;
      color: #6c757d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #session-list .session-meta {
      font-size: 11px;
      color: #adb5bd;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <!-- page 页面开始 -->
  <div class="page">
    <!-- 头部 导航 开始 -->
    <header class="navbar navbar-expand-md navbar-light d-print-none">
      <div class="container-xl">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu"
          aria-controls="navbar-menu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- 导航左侧 logo 按钮 -->
        <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
          <a href="javascript:void(0);" id="back-btn" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon me-2" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M9 11l-4 4l4 4m-4 -4h16a3 3 0 0 0 3 -3v-2a3 3 0 0 0 -3 -3h-5" />
            </svg>
            <span>返回</span>
          </a>
        </h1>
        <div class="collapse navbar-collapse" id="navbar-menu">
          <div class="d-flex flex-column flex-md-row flex-fill align-items-stretch align-items-md-center justify-content-end">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="index.html">
                  <span class="nav-link-icon d-md-none d-lg-inline-block">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-home">
                      <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                      <path d="M5 12l-2 0l9 -9l9 9l-2 0"></path>
                      <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"></path>
                      <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"></path>
                    </svg>
                  </span>
                  <span class="nav-link-title">首页</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <!-- 头部 导航 结束 -->

    <!-- 主体内容 开始 -->
    <div class="page-wrapper">
      <div class="container-xl">
        <div class="page-body">
          <!-- 智能助手聊天界面 -->
          <div class="row" style="height: calc(100vh - 200px);">
            <!-- 左侧会话列表 -->
            <div class="col-md-3 col-lg-2">
              <div class="card" style="height: 100%;">
                <div class="card-header">
                  <h3 class="card-title">会话列表</h3>
                  <button id="new-session-btn" class="btn btn-sm btn-primary ms-auto" title="新建会话">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                      <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                      <path d="M12 5v14" />
                      <path d="M5 12h14" />
                    </svg>
                  </button>
                </div>
                <div class="card-body p-0" style="overflow-y: auto;">
                  <div id="session-list" class="list-group list-group-flush">
                    <!-- 会话列表将通过 JS 动态加载 -->
                  </div>
                </div>
              </div>
            </div>
            
            <!-- 右侧聊天窗口 -->
            <div class="col-md-9 col-lg-10">
              <div class="card" style="height: 100%;">
                <div class="card-header">
                  <h3 class="card-title">智能助手</h3>
                  <span id="current-session-info" class="badge bg-muted ms-2"></span>
                </div>
                <div class="card-body d-flex flex-column">
                  <!-- 聊天记录 -->
                  <div id="chat-history" class="mb-4 flex-grow-1" style="overflow-y: auto; max-height: none;">
                    <!-- 系统欢迎消息 -->
                    <div class="mb-3 p-3 bg-light rounded">
                      <div class="font-weight-bold text-muted">智能助手:</div>
                      <div>你好！我是论坛智能助手，有什么可以帮助你的吗？</div>
                    </div>
                  </div>
                  <!-- 输入框 -->
                  <div class="input-group">
                    <input type="text" id="user-input" class="form-control" placeholder="请输入您的问题...">
                    <button id="send-btn" class="btn btn-primary">发送</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- 主体内容 结束 -->
  </div>
  <!-- page 页面结束 -->

  <!-- 导入JS -->
  <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="./dist/js/tabler.min.js"></script>
  <script src="./dist/js/jquery.toast.js"></script>
  <script>
    $(function () {
      // ==================== 返回按钮功能 ====================
      $('#back-btn').click(function() {
        // 尝试从 localStorage 获取上次访问的页面
        const lastPage = localStorage.getItem('lastPage');
        if (lastPage) {
          window.location.href = lastPage;
        } else {
          // 默认返回首页
          window.location.href = 'index.html';
        }
      });
      
      // ==================== 记录当前页面 ====================
      // 在离开当前页面时，记录当前页面为上次访问的页面
      $(window).on('beforeunload', function() {
        localStorage.setItem('lastPage', window.location.href);
      });
      
      // ==================== 全局 AJAX 设置：自动添加 JWT Token ====================
      $.ajaxSetup({
        beforeSend: function(xhr) {
          // 从 localStorage 获取 token
          const token = localStorage.getItem('token');
          if (token) {
            xhr.setRequestHeader('Authorization', 'Bearer ' + token);
          }
        },
        complete: function(xhr, status) {
          if (xhr.status === 401) {
            // 未授权，跳转到登录页
            window.location.href = 'sign-in.html';
          }
        }
      });

      // ==================== 加载对话历史 ====================
      // 页面加载时从服务器加载历史对话记录
      function loadConversationHistory() {
        $.ajax({
          type: 'get',
          url: 'dify/history',
          success: function(respData) {
            if (respData.code === 0 && respData.data) {
              const history = respData.data;
              const chatHistory = $('#chat-history');
              
              if (history.length === 0) {
                // 没有历史记录，显示欢迎消息
                chatHistory.html(`
                  <div class="mb-3 p-3 bg-light rounded">
                    <div class="font-weight-bold text-muted">智能助手:</div>
                    <div>你好！我是论坛智能助手，有什么可以帮助你的吗？</div>
                  </div>
                `);
              } else {
                // 有历史记录，清空欢迎消息
                chatHistory.empty();
                
                // 显示最近的 20 条记录
                const recentHistory = history.slice(0, 20);
                recentHistory.forEach(function(item) {
                  // 显示用户问题
                  chatHistory.append(`
                    <div class="mb-3 p-3 bg-primary text-white rounded text-right">
                      <div class="font-weight-bold">你:</div>
                      <div>${escapeHtml(item.query)}</div>
                    </div>
                  `);
                  
                  // 显示 AI 回答
                  chatHistory.append(`
                    <div class="mb-3 p-3 bg-light rounded">
                      <div class="font-weight-bold text-muted">智能助手:</div>
                      <div>${escapeHtml(item.answer)}</div>
                    </div>
                  `);
                });
                
                // 滚动到底部
                chatHistory.scrollTop(chatHistory[0].scrollHeight);
              }
            }
          },
          error: function(xhr, status, error) {
            console.log('加载对话历史失败：', error);
            // 加载失败不影响使用，显示默认欢迎消息
          }
        });
      }
      
      // HTML 转义函数，防止 XSS 攻击
      function escapeHtml(text) {
        if (!text) return '';
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
      
      // 格式化日期
      function formatDate(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const now = new Date();
        const diff = now - date;
        
        // 1 分钟内
        if (diff < 60000) {
          return '刚刚';
        }
        // 1 小时内
        if (diff < 3600000) {
          return Math.floor(diff / 60000) + '分钟前';
        }
        // 24 小时内
        if (diff < 86400000) {
          return Math.floor(diff / 3600000) + '小时前';
        }
        // 7 天内
        if (diff < 604800000) {
          return Math.floor(diff / 86400000) + '天前';
        }
        
        // 其他显示日期
        const month = date.getMonth() + 1;
        const day = date.getDate();
        return month + '/' + day;
      }
      
      // 根据 conversationId 加载对话
      function loadConversationById(conversationId) {
        $.ajax({
          type: 'get',
          url: 'dify/history',
          data: {
            conversationId: conversationId
          },
          success: function(respData) {
            if (respData.code === 0 && respData.data) {
              const history = respData.data;
              const chatHistory = $('#chat-history');
              chatHistory.empty();
              
              if (history.length === 0) {
                chatHistory.html(`
                  <div class="mb-3 p-3 bg-light rounded">
                    <div class="font-weight-bold text-muted">智能助手:</div>
                    <div>你好！我是论坛智能助手，有什么可以帮助你的吗？</div>
                  </div>
                `);
              } else {
                history.forEach(function(item) {
                  chatHistory.append(`
                    <div class="mb-3 p-3 bg-primary text-white rounded text-right">
                      <div class="font-weight-bold">你:</div>
                      <div>${escapeHtml(item.query)}</div>
                    </div>
                  `);
                  chatHistory.append(`
                    <div class="mb-3 p-3 bg-light rounded">
                      <div class="font-weight-bold text-muted">智能助手:</div>
                      <div>${escapeHtml(item.answer)}</div>
                    </div>
                  `);
                });
                chatHistory.scrollTop(chatHistory[0].scrollHeight);
              }
              $('#current-session-info').text(history.length + '条消息');
            }
          },
          error: function(xhr, status, error) {
            console.log('加载会话详情失败：', error);
            $.toast({
              heading: '错误',
              text: '加载会话失败',
              icon: 'error'
            });
          }
        });
      }
      
      // 加载会话列表
      function loadSessionList() {
        $.ajax({
          type: 'get',
          url: 'dify/sessions',
          success: function(respData) {
            if (respData.code === 0 && respData.data) {
              const sessions = respData.data;
              const sessionList = $('#session-list');
              sessionList.empty();
              
              if (sessions.length === 0) {
                sessionList.html(`
                  <div class="text-center text-muted p-3">
                    <small>暂无会话</small>
                  </div>
                `);
              } else {
                sessions.forEach(function(session, index) {
                  const sessionItem = $(`
                    <a href="javascript:void(0);" class="list-group-item list-group-item-action" data-conversation-id="${session.conversationId}">
                      <div class="session-title">${escapeHtml(session.sessionName || '新会话')}</div>
                      <div class="session-preview">${escapeHtml(session.lastAnswer || '')}</div>
                      <div class="session-meta">
                        <span>${session.messageCount}条消息</span>
                        <span class="float-end">${formatDate(session.updateTime)}</span>
                      </div>
                    </a>
                  `);
                  
                  sessionItem.click(function() {
                    loadConversationById(session.conversationId);
                    $('#session-list .list-group-item').removeClass('active');
                    $(this).addClass('active');
                  });
                  
                  sessionList.append(sessionItem);
                  if (index === 0) {
                    sessionItem.addClass('active');
                  }
                });
              }
            }
          },
          error: function(xhr, status, error) {
            console.log('加载会话列表失败：', error);
          }
        });
      }
      
      // 页面加载时加载会话列表和对话历史
      loadSessionList();
      loadConversationHistory();

      // ==================== 新建会话 ====================
      $('#new-session-btn').click(function() {
        // 清空聊天历史
        const chatHistory = $('#chat-history');
        chatHistory.html(`
          <div class="mb-3 p-3 bg-light rounded">
            <div class="font-weight-bold text-muted">智能助手:</div>
            <div>你好！我是论坛智能助手，有什么可以帮助你的吗？</div>
          </div>
        `);
        
        // 清除当前会话信息
        $('#current-session-info').text('');
        
        // 移除所有选中状态
        $('#session-list .list-group-item').removeClass('active');
        
        // 重新加载会话列表（确保显示最新的会话）
        loadSessionList();
        
        // 提示用户
        $.toast({
          heading: '提示',
          text: '已新建会话，请输入您的问题',
          icon: 'info'
        });
      });

      // ==================== 发送消息 ====================
      $('#send-btn').click(function() {
        sendMessage();
      });

      // 回车键发送消息
      $('#user-input').keypress(function(e) {
        if (e.which === 13) {
          sendMessage();
        }
      });

      function sendMessage() {
        const userInput = $('#user-input').val().trim();
        if (!userInput) {
          return;
        }

        // 添加用户消息到聊天记录
        const chatHistory = $('#chat-history');
        chatHistory.append(`
          <div class="mb-3 p-3 bg-primary text-white rounded text-right">
            <div class="font-weight-bold">你:</div>
            <div>${escapeHtml(userInput)}</div>
          </div>
        `);

        // 清空输入框
        $('#user-input').val('');

        // 滚动到底部
        chatHistory.scrollTop(chatHistory[0].scrollHeight);

        // 添加智能助手正在思考的提示
        const loadingId = 'loading-' + Date.now();
        chatHistory.append(`
          <div class="mb-3 p-3 bg-light rounded" id="${loadingId}">
            <div class="font-weight-bold text-muted">智能助手:</div>
            <div class="loading-dots">
              <span>.</span><span>.</span><span>.</span>
            </div>
          </div>
        `);
        chatHistory.scrollTop(chatHistory[0].scrollHeight);

        // 调用 Dify API（后端会自动保存到数据库）
        console.log('发送请求到：dify/chat');
        console.log('请求数据：', { query: userInput });
        $.ajax({
          type: 'post',
          url: 'dify/chat',
          data: {
            query: userInput
          },
          success: function(respData) {
            console.log('收到响应：', respData);
            // 移除加载提示
            $(`#${loadingId}`).remove();
            
            if (respData.code === 0) {
              // 添加智能助手回答到聊天记录（只显示最终回答）
              chatHistory.append(`
                <div class="mb-3 p-3 bg-light rounded">
                  <div class="font-weight-bold text-muted">智能助手:</div>
                  <div>${escapeHtml(respData.data)}</div>
                </div>
              `);
              // 滚动到底部
              chatHistory.scrollTop(chatHistory[0].scrollHeight);
              
              // 刷新会话列表（确保显示最新的会话）
              loadSessionList();
            } else {
              $.toast({
                heading: '错误',
                text: respData.message,
                icon: 'error'
              });
            }
          },
          error: function(xhr, status, error) {
            console.log('请求失败：', xhr, status, error);
            // 移除加载提示
            $(`#${loadingId}`).remove();
            
            let errorMsg = '调用智能助手失败，请稍后再试。';
            if (xhr.status === 404) {
              errorMsg = '接口不存在，请检查后端配置。';
            } else if (xhr.status === 500) {
              errorMsg = '服务器内部错误：' + xhr.responseText;
            } else if (xhr.status === 0) {
              errorMsg = '网络连接失败，请检查服务器是否运行。';
            }
            $.toast({
              heading: '错误',
              text: errorMsg,
              icon: 'error'
            });
          }
        });
      }

      // 页面加载时检查登录状态
      function checkLoginStatus() {
        const token = localStorage.getItem('token');
        return !!token;
      }

      if (!checkLoginStatus()) {
        window.location.href = 'sign-in.html';
      }
    });
  </script>
</body>
</html>
