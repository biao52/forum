<div class="container-xl">
  <div class="page-header d-print-none">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h2 class="page-title">文章管理</h2>
        <div class="text-muted mt-1">管理论坛的所有帖子内容</div>
      </div>
      <div class="col-auto ms-auto d-print-none">
        <div class="d-flex">
          <input type="search" id="admin_article_search_input" class="form-control d-inline-block w-9 me-3" placeholder="搜索文章标题/内容...">
          <button id="admin_article_search_btn" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><circle cx="10" cy="10" r="7" /><line x1="21" y1="21" x2="15" y2="15" /></svg>
            查询
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card mt-3">
    <div class="table-responsive">
      <table class="table table-vcenter card-table table-striped text-nowrap">
        <thead>
        <tr>
          <th class="w-1">ID</th>
          <th>文章标题</th>
          <th>作者 (用户ID)</th>
          <th>所属版块</th>
          <th>数据 (浏览/点赞/回复)</th>
          <th>发布时间</th>
          <th>状态</th>
          <th class="w-1">操作</th>
        </tr>
        </thead>
        <tbody id="admin_article_tbody">
        <tr>
          <td colspan="8" class="text-center text-muted">数据加载中...</td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="card-footer d-flex align-items-center">
      <div class="text-muted">
        每页显示
        <select id="admin_article_page_size" class="form-select form-select-sm d-inline-block w-auto mx-2">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
        条，共 <span id="admin_article_total_count" class="font-weight-bold text-primary">0</span> 条记录
      </div>
      <ul class="pagination m-0 ms-auto" id="admin_article_pagination">
      </ul>
    </div>
  </div>
</div>

<div class="modal modal-blur fade" id="admin_article_edit_modal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">修改帖子</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit_modal_article_id">
        <div class="mb-3">
          <label class="form-label required">文章标题</label>
          <input type="text" class="form-control" id="edit_modal_article_title" placeholder="请输入标题（长度2-100字）">
        </div>
        <div class="mb-3">
          <label class="form-label required">正文内容</label>
          <textarea class="form-control" rows="10" id="edit_modal_article_content" placeholder="请输入正文"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <a href="#" class="btn btn-link link-secondary" data-bs-dismiss="modal">取消</a>
        <a href="#" class="btn btn-primary ms-auto" id="edit_modal_save_btn">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l5 5l10 -10" /></svg>
          保存修改
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  $(function() {
    let allArticlesData = [];
    let currentPage = 1;
    let pageSize = parseInt($('#admin_article_page_size').val());

    function loadAdminArticles() {
      let keyword = $('#admin_article_search_input').val().trim();
      let url = 'article/getAllByBoardId';
      if (keyword) {
        url += '?keyword=' + encodeURIComponent(keyword);
      }

      $.ajax({
        type: 'GET',
        url: url,
        success: function(respData) {
          if (respData.code == 0) {
            allArticlesData = respData.data || [];
            currentPage = 1;
            renderArticleTable();
          } else {
            $.toast({ heading: '警告', text: respData.message, icon: 'warning' });
          }
        },
        error: function() {
          $.toast({ heading: '错误', text: '无法获取文章列表，请检查网络或登录状态', icon: 'error' });
        }
      });
    }

    function renderArticleTable() {
      let total = allArticlesData.length;
      $('#admin_article_total_count').text(total);

      let startIdx = (currentPage - 1) * pageSize;
      let endIdx = startIdx + pageSize;
      let pageData = allArticlesData.slice(startIdx, endIdx);

      let html = '';
      if (pageData.length === 0) {
        html = '<tr><td colspan="8" class="text-center text-muted py-4">没有找到相关的帖子</td></tr>';
      } else {
        pageData.forEach(item => {
          // 根据作者状态显示文章状态
          let stateBadge = '';
          let authorState = (item.user && item.user.state !== undefined) ? item.user.state : 0;
          if (item.deleteState === 1) {
            stateBadge = '<span class="badge bg-secondary text-white">已删除</span>';
          } else if (authorState === 1) {
            stateBadge = '<span class="badge bg-danger text-white">已禁言</span>';
          } else {
            stateBadge = '<span class="badge bg-success text-white">正常</span>';
          }

          // 更稳健的作者名称获取逻辑 (兼容对象嵌套和平铺数据)
          let authorName = "UID: " + item.userId;
          console.log("this is item: " + item)
          if (item.user) {
            if (item.user.username && item.user.username.trim() !== '') {
              authorName = item.user.username;
            } else if (item.user.nickname && item.user.nickname.trim() !== '') {
              authorName = item.user.nickname;
            }
          } else if (item.username || item.nickname) {
            // 容错：如果后端直接把字段打平放到了外层
            authorName = item.username || item.nickname;
          }


          // 2. 获取版块名字：优先展示真实的版块名
          let boardName = (item.board && item.board.name) ? item.board.name : ("版块ID: " + item.boardId);
          let cTime = '-';
          if (item.createTime) {
            if (typeof item.createTime === 'string') {
              cTime = item.createTime.replace('T', ' ');
            } else {
              let date = new Date(item.createTime);
              let y = date.getFullYear();
              let m = String(date.getMonth() + 1).padStart(2, '0');
              let d = String(date.getDate()).padStart(2, '0');
              let h = String(date.getHours()).padStart(2, '0');
              let min = String(date.getMinutes()).padStart(2, '0');
              cTime = `${y}-${m}-${d} ${h}:${min}`;
            }
          }

          // 确保 likeCount 默认值为 0，避免后端返回 null 导致显示异常
          let currentLikeCount = item.likeCount || 0;

          html += `
            <tr>
              <td><span class="text-muted">${item.id}</span></td>
              <td><div class="text-truncate" style="max-width: 250px;" title="${item.title}"><strong>${item.title}</strong></div></td>

              <td>
                <div class="d-flex align-items-center">
                  <div class="flex-fill">
                    <div class="font-weight-medium">${authorName}</div>
                    <div class="text-muted small">ID: ${item.userId}</div>
                  </div>
                </div>
              </td>

              <td>
                <span class="badge badge-outline text-azure">${boardName}</span>
              </td>

              <td class="text-muted">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-eye" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><circle cx="12" cy="12" r="2" /><path d="M22 12c-2.667 4.667 -6 7 -10 7s-7.333 -2.333 -10 -7c2.667 -4.667 6 -7 10 -7s7.333 2.333 10 7" /></svg> ${item.visitCount} &nbsp;
                <svg xmlns="http://www.w3.org/2000/svg" class="icon text-pink" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428m0 0a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572" /></svg> ${currentLikeCount} &nbsp;
                <svg xmlns="http://www.w3.org/2000/svg" class="icon text-azure" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 21v-13a3 3 0 0 1 3 -3h10a3 3 0 0 1 3 3v6a3 3 0 0 1 -3 3h-9l-4 4" /></svg> ${item.replyCount}
              </td>
              <td class="text-muted">${cTime}</td>
              <td>${stateBadge}</td>
              <td>
                <div class="btn-list flex-nowrap">
                  <a href="javascript:void(0);" class="btn btn-primary btn-sm admin-btn-edit" data-id="${item.id}">修改</a>
                  <a href="javascript:void(0);" class="btn btn-warning btn-sm admin-btn-ban" data-uid="${item.userId}">禁用</a>
                  <a href="javascript:void(0);" class="btn btn-danger btn-sm admin-btn-delete ${item.deleteState===1?'disabled':''}" data-id="${item.id}">删除</a>
                </div>
              </td>
            </tr>
          `;
        });
      }
      $('#admin_article_tbody').html(html);
      renderPagination(total);
    }

    function renderPagination(total) {
      let totalPages = Math.ceil(total / pageSize) || 1;
      let html = '';

      html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link page-prev" href="javascript:void(0);">上一页</a></li>`;
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          html += `<li class="page-item ${currentPage === i ? 'active' : ''}"><a class="page-link page-num" data-page="${i}" href="javascript:void(0);">${i}</a></li>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          html += `<li class="page-item disabled"><a class="page-link" href="javascript:void(0);">...</a></li>`;
        }
      }
      html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link page-next" href="javascript:void(0);">下一页</a></li>`;

      $('#admin_article_pagination').html(html);
    }

    $('#admin_article_search_btn').click(function() { loadAdminArticles(); });
    $('#admin_article_search_input').keypress(function(e) { if (e.which == 13) loadAdminArticles(); });
    $('#admin_article_page_size').change(function() { pageSize = parseInt($(this).val()); currentPage = 1; renderArticleTable(); });

    $('#admin_article_pagination').on('click', '.page-prev', function() { if (currentPage > 1) { currentPage--; renderArticleTable(); } });
    $('#admin_article_pagination').on('click', '.page-next', function() { let totalPages = Math.ceil(allArticlesData.length / pageSize); if (currentPage < totalPages) { currentPage++; renderArticleTable(); } });
    $('#admin_article_pagination').on('click', '.page-num', function() { currentPage = parseInt($(this).data('page')); renderArticleTable(); });

    $('#admin_article_tbody').on('click', '.admin-btn-ban', function() {
      let userId = $(this).data('uid');
      let banBtn = $(this);
      if (confirm('确定要对该文章的作者进行禁言处理吗？禁言后该用户将无法发帖和回复。')) {
        $.ajax({
          type: 'POST',
          url: 'user/admin/ban',
          contentType: 'application/x-www-form-urlencoded',
          data: { id: userId, state: 1 },
          success: function(res) {
            if (res.code == 0) {
              $.toast({ heading: '成功', text: '该用户已被成功禁言', icon: 'success' });
              // 直接更新当前行的状态列
              banBtn.closest('tr').find('td:eq(6)').html('<span class="badge bg-danger text-white">已禁言</span>');
              // 同时刷新列表确保数据一致
              loadAdminArticles();
            } else {
              $.toast({ heading: '警告', text: res.message || '操作失败', icon: 'warning' });
            }
          },
          error: function() {
            $.toast({ heading: '错误', text: '网络异常或接口未实现', icon: 'error' });
          }
        });
      }
    });

    $('#admin_article_tbody').on('click', '.admin-btn-delete', function() {
      let articleId = $(this).data('id');
      if (confirm('确定要删除这条帖子吗？此操作属于逻辑删除，用户将无法看到该帖子。')) {
        $.ajax({
          type: 'POST',
          url: 'article/delete',
          contentType: 'application/x-www-form-urlencoded',
          data: { id: articleId },
          success: function(res) {
            if (res.code == 0) {
              $.toast({ heading: '成功', text: '文章删除成功', icon: 'success' });
              loadAdminArticles();
            } else {
              $.toast({ heading: '警告', text: res.message, icon: 'warning' });
            }
          }
        });
      }
    });

    $('#admin_article_tbody').on('click', '.admin-btn-edit', function() {
      let articleId = $(this).data('id');
      $.ajax({
        type: 'GET',
        url: 'article/details?id=' + articleId,
        success: function(res) {
          if (res.code == 0) {
            $('#edit_modal_article_id').val(res.data.id);
            $('#edit_modal_article_title').val(res.data.title);
            $('#edit_modal_article_content').val(res.data.content);
            $('#admin_article_edit_modal').modal('show');
          } else {
            $.toast({ heading: '警告', text: '获取文章详情失败', icon: 'warning' });
          }
        }
      });
    });

    $('#edit_modal_save_btn').click(function() {
      let articleId = $('#edit_modal_article_id').val();
      let newTitle = $('#edit_modal_article_title').val().trim();
      let newContent = $('#edit_modal_article_content').val().trim();

      if (!newTitle || !newContent) {
        $.toast({ heading: '提示', text: '标题和内容不能为空', icon: 'warning' });
        return;
      }

      $.ajax({
        type: 'POST',
        url: 'article/modify',
        contentType: 'application/x-www-form-urlencoded',
        data: { id: articleId, title: newTitle, content: newContent },
        success: function(res) {
          if (res.code == 0) {
            $.toast({ heading: '成功', text: '文章修改成功', icon: 'success' });
            $('#admin_article_edit_modal').modal('hide');
            loadAdminArticles();
          } else {
            $.toast({ heading: '警告', text: res.message, icon: 'warning' });
          }
        }
      });
    });

    loadAdminArticles();
  });
</script>
