<!-- Page header -->

  <div class="container-xl">
    <!-- 帖子Id -->

        <!-- 帖子标题 -->
        <h2 class="page-title" id="details_article_title"></h2>
      </div>
    </div>
    <div class="col-auto d-none d-md-inline" style="padding: 0px 3px;">
      <ul class="list-inline list-inline-dots mb-0">
        <li class="list-inline-item">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-clock-edit" width="24" height="24"

            stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>

            <path d="M12 7v5l2 2"></path>
            <path d="M18.42 15.61a2.1 2.1 0 0 1 2.97 2.97l-3.39 3.42h-3v-3l3.42 -3.39z"></path>
          </svg>
          <!-- 发布时间 -->

        </li>
        <li class="list-inline-item">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-eye" width="24" height="24"
            viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"
            stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path>
            <path d="M22 12c-2.667 4.667 -6 7 -10 7s-7.333 -2.333 -10 -7c2.667 -4.667 6 -7 10 -7s7.333 2.333 10 7">
            </path>
          </svg>
          <!-- 访问数量 -->
          <span id="details_article_visitCount"></span>
        </li>
        <li class="list-inline-item">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-heart" width="24" height="24"
            viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"
            stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"></path>
          </svg>

        </li>
        <li class="list-inline-item">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-message-circle" width="24"
            height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"
            stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M3 20l1.3 -3.9a9 8 0 1 1 3.4 2.9l-4.7 1"></path>
            <path d="M12 12l0 .01"></path>
            <path d="M8 12l0 .01"></path>
            <path d="M16 12l0 .01"></path>
          </svg>
          <!-- 回复数量 -->
          <span id="details_article_replyCount"></span>
        </li>
      </ul>
    </div>
  </div>
</div>

                      <path d="M14 11l0 6"></path>

<script>
  $(function () {
    // ===================== 初始化回复编辑区 ===================== 
    var editor = editormd("article_details_reply", {
      width: "100%",
      height: "100%",
      // theme : "dark",
      // previewTheme : "dark",
      // editorTheme : "pastel-on-dark",
      autoFocus: false, // 关闭自动获得焦点
      codeFold: true,
      markdown : '', // 处理编辑区内容
      //syncScrolling : false,
      saveHTMLToTextarea: true,    // 保存 HTML 到 Textarea
      searchReplace: true,
      watch: false,                    // 关闭实时预览
      htmlDecode: "style,script,iframe|on*",            // 开启 HTML 标签解析，为了安全性，默认不开启    
      // toolbar  : false,             //关闭工具栏
      // previewCodeHighlight : false, // 关闭预览 HTML 的代码块高亮，默认开启
      emoji: true,
      taskList: true,
      tocm: true,         // Using [TOCM]
      tex: true,                     // 开启科学公式TeX语言支持，默认关闭
      // flowChart : true,               // 开启流程图支持，默认关闭
      // sequenceDiagram : true,         // 开启时序/序列图支持，默认关闭,
      placeholder: '开始创作...',     // 占位符
      path: "./dist/editor.md/lib/"
    });

    // ===================== 请求帖子详情 ===================== 
    // url: '/article/getById?id=' + currentArticle.id,
    // 成功后， 调用initArticleDetails()方法，初始化页面内容
    $.ajax({
      type : 'get',
      url : 'article/details?id=' + currentArticle.id,
      // 回调
      success : function (respData) {
        if (respData.code == 0) {
          // 成功
          initArticleDetails(respData.data);
        } else {
          // 提示信息
          $.toast({
                heading: '警告',
                text: respData.message,
                icon: 'warning'
            });
        }
      },
      error : function () {
        // 提示信息
        $.toast({
            heading: '错误',
            text: '访问出现问题，请与管理员联系.',
            icon: 'error'
        });
      }
    });

    // ===================== 初始化页面内空 ======================
    function initArticleDetails(article) {
      // 设置当前操作的帖子为最新查询出来的值
      currentArticle = article;
      // 默认头像路径
      if (!article.user.avatarUrl) {
        article.user.avatarUrl = avatarUrl;
      }

      // 设置头像
      $('#article_details_author_avatar').css('background-image', 'url(' + article.user.avatarUrl + ')');
      // 设置用户名
      $('#article_details_author_name').html(article.user.nickname);
      // 设置帖子Id
      $('#details_article_id').val(article.id);
      // 设置帖子标题
      $('#details_article_title').html(article.title);
      // 设置发布时间
      $('#details_article_createTime').html(article.createTime);
      // 设置访问数量
      $('#details_article_visitCount').html(article.visitCount);
      // 设置点赞数
      $('#details_article_likeCount').html(article.likeCount);
      // 设置回复数
      $('#details_article_replyCount').html(article.replyCount);
      // 帖子正文
      $('#details_article_content_title').html(article.title)
      // 让内容以markdown 的形式显示
      editormd.markdownToHTML('details_article_content', { markdown: article.content });
      // 编辑权限通过后台返回的属性值处理
      if (article.own) {
        $('.details-is-own').show();
      }
      // 是否显示站内信按钮
      if (article.user.id == currentUserId) {
        $('#div_details_send_message').hide();
      } else {
        // 设置站内信目标用户信息
        $('#btn_details_send_message').click(function() {
          setMessageReceiveUserInfo(article.user.id, article.user.nickname);
        });
      }
      // 个人帖子列表
      $('#article_details_author_name').click(function () {
          // 设置要查看用户的Id
          profileUserId = article.userId;
          // 是否为当前登录用户
          if (article.userId == currentUserId) {
            profileUserId = undefined;
          }
          $('#bit-forum-content').load('profile.html');
        });

      // 加载回复列表
      loadArticleDetailsReply();
    }

    // ====================== 加载回复列表 ======================
    // url: 'reply/getReplies?articleId=' + currentArticle.id
    // 成功后，调用buildArticleReply()方法构建回复列表
    function loadArticleDetailsReply() {
      $.ajax({
        type : 'get',
        url : 'reply/getReplies?articleId=' + currentArticle.id,
        success : function (respData) {
        if (respData.code == 0) {
          // 成功
          buildArticleReply(respData.data);
        } else {
          // 提示信息
          $.toast({
                heading: '警告',
                text: respData.message,
                icon: 'warning'
            });
          }
        },
        error : function () {
          // 提示信息
          $.toast({
              heading: '错误',
              text: '访问出现问题，请与管理员联系.',
              icon: 'error'
          });
        }
      });
    }
    // 
    function buildArticleReply(data) {
      let replyArea = $('#details_reply_area');
      if (!data || data.length == 0) {
        replyArea.html('<p>还没有回复，第一个写下回复吧</p>');
        return;
      }
      $('#details_reply_area').html('');

      // 分离顶级回复和子回复（楼中楼）
      let topReplies = [];
      let childReplies = {};
      data.forEach(function(r) {
        if (!r.replyId) {
          topReplies.push(r);
        } else {
          if (!childReplies[r.replyId]) {
            childReplies[r.replyId] = [];
          }
          childReplies[r.replyId].push(r);
        }
      });

      // 构建单条回复
      function buildOneReply(articleReply, isNested) {
        let ava = avatarUrl;
        if (articleReply.user && articleReply.user.avatarUrl && articleReply.user.avatarUrl.startsWith('http')) {
          ava = articleReply.user.avatarUrl;
        }
        let authorName = articleReply.user ? (articleReply.user.nickname || articleReply.user.username || '已注销用户') : '已注销用户';
        let authorId = articleReply.user ? articleReply.user.id : 0;
        let replyToName = '';
        if (articleReply.replyUser) {
          replyToName = articleReply.replyUser.nickname || articleReply.replyUser.username || '已注销用户';
        }

        let replyMargin = isNested ? 'margin-left: 48px;' : '';
        let replyBorder = isNested ? 'border-left: 3px solid #e0e0e0;' : '';

        let replyHtml = '<div class="reply-item" style="' + replyMargin + replyBorder + ' padding: 8px 12px; margin-bottom: 4px;">'
          + ' <div style="display:flex; align-items:flex-start;">'
          + ' <div style="flex-shrink:0; margin-right:12px; text-align:center; width:48px;">'
          + ' <span class="avatar rounded" style="background-image: url(' + ava + '); width:36px; height:36px; display:inline-block;"></span>'
          + ' </div>'
          + ' <div style="flex:1; min-width:0;">'
          + ' <div style="margin-bottom:4px;">'
          + ' <a href="javascript:void(0);" class="a_reply_user_profile" style="font-weight:600; color:#333; text-decoration:none; font-size:13px;">' + authorName + '</a>'
          + (replyToName ? ' <span style="color:#999; font-size:12px;">回复</span> <span style="color:#0d6efd; font-size:12px;">@' + replyToName + '</span>' : '')
          + ' </div>'
          + ' <div id="details_article_reply_content_' + articleReply.id + '" style="font-size:14px; line-height:1.6; margin-bottom:6px;"></div>'
          + ' <div style="display:flex; align-items:center; font-size:12px; color:#999;">'
          + ' <span>' + (articleReply.createTime || '') + '</span>'
          + ' <a href="javascript:void(0);" class="btn-reply" data-id="' + articleReply.id + '" data-nickname="' + authorName + '" style="margin-left:12px; color:#0d6efd; text-decoration:none; font-size:12px;">'
          + ' <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-message-circle" width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 20l1.3 -3.9a9 8 0 1 1 3.4 2.9l-4.7 1"/><path d="M12 12l0 .01"/><path d="M8 12l0 .01"/><path d="M16 12l0 .01"/></svg>'
          + ' 回复</a>'
          + (articleReply.user && articleReply.user.id != currentUserId
            ? ' <a href="javascript:void(0);" class="btn_reply_send_message" data-uid="' + authorId + '" data-uname="' + authorName + '" style="margin-left:8px; color:#0d6efd; text-decoration:none; font-size:12px;">发私信</a>'
            : '')
          + ' <span class="reply-actions" style="display:none; margin-left:8px;">'
          + ' <a href="javascript:void(0);" class="reply-delete" data-id="' + articleReply.id + '" style="color:#dc3545; text-decoration:none; font-size:12px;">删除</a>'
          + ' </span>'
          + ' </div>'
          + ' <div class="child-replies" data-parent-id="' + articleReply.id + '" style="margin-top:4px;"></div>'
          + ' </div>'
          + ' </div>'
          + ' </div>';

        let replyItem = $(replyHtml);

        replyItem.find('.a_reply_user_profile').click(function() {
          profileUserId = articleReply.user ? articleReply.user.id : 0;
          $('#bit-forum-content').load('profile.html');
        });

        replyItem.find('.btn_reply_send_message').click(function() {
          let uid = $(this).data('uid');
          let uname = $(this).data('uname');
          setMessageReceiveUserInfo(uid, uname);
          $('#index_message_modal').modal('show');
        });

        let delBtn = replyItem.find('.reply-delete');
        if (articleReply.user && (articleReply.user.id == currentUserId || currentArticle.userId == currentUserId)) {
          delBtn.closest('.reply-actions').show();
        }
        delBtn.click(function() {
          $('#reply_delete_btn').data('reply-id', $(this).data('id'));
          $('#reply_delete_modal').modal('show');
        });

        replyItem.find('.btn-reply').click(function() {
          $('#reply_to_id').val($(this).data('id'));
          $('#reply_to_user').text('回复 @' + $(this).data('nickname'));
          $('#reply_to_hint').show();
          $('html, body').animate({scrollTop: $('#article_details_reply').offset().top - 100}, 300);
          editor.focus();
        });

        return replyItem;
      }

      // 递归渲染回复及子回复
      function renderReplyWithChildren(reply, container, isNested) {
        let item = buildOneReply(reply, isNested);
        container.append(item);
        editormd.markdownToHTML('details_article_reply_content_' + reply.id, { markdown: reply.content || '' });

        let children = childReplies[reply.id];
        if (children && children.length > 0) {
          let childContainer = item.find('.child-replies');
          children.forEach(function(child) {
            renderReplyWithChildren(child, childContainer, true);
          });
        }
      }

      topReplies.forEach(function(articleReply) {
        renderReplyWithChildren(articleReply, replyArea, false);
      });
    }
    // ====================== 加载回复 ======================
    // 已移至 initArticleDetails() 中调用，确保 currentArticle.id 有值后再加载


    // ====================== 处理点赞 ======================
    // url: '/article/thumbsUp?id=' + currentArticle.id
    // 成功后，修改点赞个数 currentArticle.likeCount = currentArticle.likeCount + 1;
    let isLiked = false; // 记录当前点赞状态
    $('#details_btn_like_count').click(function () {
      if (isLiked) {
        // 取消点赞
        $.ajax({
          type: 'post',
          url: 'article/cancelThumbsUp?id=' + currentArticle.id,
          // 回调
          success: function (respData) {
            // 成功状态
            if (respData.code == 0) {
              // 成功
              currentArticle.likeCount = Math.max(0, currentArticle.likeCount - 1);
              // 设置页面的值 
              $('#details_article_likeCount').html(currentArticle.likeCount);
              // 恢复点赞图标
              $('#details_btn_like_count').html('<svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"></path></svg> 点赞');
              // 标记为未点赞状态
              isLiked = false;
              // 提示
              $.toast({
                  heading: '成功',
                  text: '取消点赞成功',
                  icon: 'success'
              });
            } else {
              // 提示信息
              $.toast({
                    heading: '警告',
                    text: respData.message,
                    icon: 'warning'
                });
            }
          },
          error: function () {
            // 提示信息
            $.toast({
                heading: '错误',
                text: '访问出现问题，请与管理员联系.',
                icon: 'error'
            });
          }
        });
      } else {
        // 点赞
        $.ajax({
          type: 'post',
          url: 'article/thumbsUp?id=' + currentArticle.id,
          // 回调
          success: function (respData) {
            // 成功状态
            if (respData.code == 0) {
              // 成功
              currentArticle.likeCount = currentArticle.likeCount + 1;
              // 设置页面的值 
              $('#details_article_likeCount').html(currentArticle.likeCount);
              // 更改点赞图标为已点赞状态
              $('#details_btn_like_count').html('<svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="currentColor" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"></path></svg> 已点赞');
              // 标记为已点赞状态
              isLiked = true;
              // 提示
              $.toast({
                  heading: '成功',
                  text: '点赞成功',
                  icon: 'success'
              });
            } else {
              // 提示信息
              $.toast({
                    heading: '警告',
                    text: respData.message,
                    icon: 'warning'
                });
            }
          },
          error: function () {
            // 提示信息
            $.toast({
                heading: '错误',
                text: '访问出现问题，请与管理员联系.',
                icon: 'error'
            });
          }
        });
      }
    });

    // ====================== 回复帖子 ======================
    $('#details_btn_article_reply').click(function () {
      let articleIdEl = $('#details_article_id');
      let replyContentEl = $('#details_article_reply_content');
      let replyToIdEl = $('#reply_to_id');
      // 非空校验
      if (!replyContentEl.val()) {
        // 提示
        $.toast({
          heading: '提示',
          text: '请输入回复内容',
          icon: 'warning'
        });
        return;
      }

      // 构造请求参数
      let postData = {
        articleId : articleIdEl.val(),
        content : replyContentEl.val()
      };
      
      // 如果有回复的评论ID，添加到请求参数中
      if (replyToIdEl.val()) {
        postData.replyId = replyToIdEl.val();
      }
      
      // 发送请求，成功后 
      // 1. 清空回复区域
      // 2. 更新回贴数 currentArticle.replyCount = currentArticle.replyCount + 1;
      // 3. 调用loadArticleDetailsReply()方法，重新构建回贴列表
      $.ajax({
        type : 'post',
        url : 'reply/create',
        contentType : 'application/x-www-form-urlencoded',
        data : postData,
        success : function (respData) {
          if (respData.code == 0) {
            // 成功提示
            $.toast({
              heading: '提示',
              text: '回复成功',
              icon: 'success' // 绿色
            });

            // 清空回复内容
            replyContentEl.val('');
            editor.setMarkdown('');
            // 清空回复提示
            $('#reply_to_user').text('');
            $('#reply_to_hint').hide();
            replyToIdEl.val('');
            
            // 更新全局变量中的值
            currentArticle.replyCount = currentArticle.replyCount + 1; 
            // 更新页面上的回复数量
            $('#details_article_replyCount').html(currentArticle.replyCount);
            // 重构回复列表
            loadArticleDetailsReply();
          } else {
            // 失败提示
            $.toast({
              heading: '提示',
              text: respData.message,
              icon: 'warning'  // 棕色
            });
          }
        },
        error : function () {
          // 提示信息
          $.toast({
              heading: '警告',
              text: '回复失败，请与管理员联系.',
              icon: 'error'  // 红色
          });
        }

      });
    });

    // ====================== 取消回复 ======================
    $('#reply_to_cancel').click(function () {
      $('#reply_to_id').val('');
      $('#reply_to_user').text('');
      $('#reply_to_hint').hide();
    });

    // ====================== 处理删除事件 ======================
    // 成功后，调用changeNavActive($('#nav-link-title'));  回到首页
    // url: 'article/delete?id=' + $('#details_article_id').val()
    $('#details_artile_delete').click(function () {
      $.ajax({
        type: 'post',
        url : 'article/delete?id=' + $('#details_article_id').val(),
        // 回调
        success : function (respData) {
          // 成功状态
          if (respData.code == 0) {
            // 成功提示
            $.toast({
                heading: '成功',
                text: '删除成功',
                icon: 'success'
            });
            // 跳转到首页帖子列表
            changeNavActive($('#nav-link-title'));
          } else {
            // 提示信息
            $.toast({
                  heading: '警告',
                  text: respData.message,
                  icon: 'warning'
              });
          }
        },
        error : function () {
          // 提示信息
          $.toast({
              heading: '错误',
              text: '访问出现问题，请与管理员联系.',
              icon: 'error'
          });
        }
      });

    });

    // ====================== 处理编辑事件 ======================
    $('#details_artile_edit').click(function () {
      console.log('开始编辑');
      removeNavActive();
      $('#bit-forum-content').load('article_edit.html');
    });

    // ====================== 处理评论删除事件 ======================
    $('#reply_delete_btn').click(function () {
      let replyId = $(this).data('reply-id');
      $.ajax({
        type: 'post',
        url: 'reply/delete?id=' + replyId,
        success: function (respData) {
          if (respData.code == 0) {
            $.toast({
              heading: '成功',
              text: '删除成功',
              icon: 'success'
            });
            // 更新回复数
            currentArticle.replyCount = Math.max(0, currentArticle.replyCount - 1);
            $('#details_article_replyCount').html(currentArticle.replyCount);
            // 重新加载回复列表
            loadArticleDetailsReply();
          } else {
            $.toast({
              heading: '警告',
              text: respData.message,
              icon: 'warning'
            });
          }
        },
        error: function () {
          $.toast({
            heading: '错误',
            text: '访问出现问题，请与管理员联系.',
            icon: 'error'
          });
        }
      });
    });
  });
</script>
